name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build and test the workspace
        working-directory: core
        run: |
          cargo build --release --workspace
          cargo test --release --workspace

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --locked
      - name: Build the APK (fails if INTERNET appears in the merged manifest)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: scripts/build-android.sh debug arm64-v8a x86_64
      - name: Assert no INTERNET permission in the APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee perms.txt
          ! grep -q "android.permission.INTERNET" perms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
