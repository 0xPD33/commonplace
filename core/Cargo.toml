[workspace]
resolver = "3"
members = ["commonplace-core", "commonplace-llm", "commonplace-ffi", "commonplace-cli", "packbuild"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
commonplace-core = { path = "commonplace-core" }
commonplace-llm = { path = "commonplace-llm" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
memmap2 = "0.9"
zstd = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
tantivy = "=0.26.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
ndarray = "0.17"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
safetensors = "0.6"
half = "2"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
regex = "1"
unicode-segmentation = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
