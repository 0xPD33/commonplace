[project]
name = "commonplace-pipeline"
version = "0.1.0"
description = "Offline build pipeline for Commonplace packs"
requires-python = ">=3.12"
dependencies = [
  "pyarrow>=21",
  "numpy>=2",
  "onnxruntime>=1.22",
  "tokenizers>=0.22",
  "faiss-cpu>=1.12",
  "httpx>=0.28",
  "pyyaml>=6",
  "duckdb>=1.5.6",
  "wikitextparser>=2.0.0",
  "libzim>=3.7",
  "lxml>=6",
  "cssselect>=1.3",
]

[project.optional-dependencies]
gpu = ["torch>=2.8", "transformers>=4.56", "sentence-transformers>=5", "onnxscript>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commonplace_pipeline"]
